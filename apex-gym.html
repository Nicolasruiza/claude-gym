<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b0d"><title>Apex Gym</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{--bg:#090b0d;--panel:#111519;--panel2:#171c21;--line:#242b31;--text:#f5f4f1;--muted:#929aa3;--accent:#ff8a32;--accent2:#ffb067;--accentDim:rgba(255,138,50,.12)}*{box-sizing:border-box}body{margin:0;background:#050607;color:var(--text);font-family:'DM Sans',system-ui,sans-serif;display:flex;justify-content:center}button,input{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}.app{width:min(100%,430px);min-height:100vh;background:var(--bg);padding-bottom:92px}.top{display:flex;align-items:center;justify-content:space-between;padding:18px 16px 8px;min-height:62px}.brand{font-size:23px;font-weight:700}.brand span{color:var(--accent)}.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#5b341b);display:grid;place-items:center;font-weight:700}.content{padding:12px 16px}.hero{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:20px;min-height:238px;background:#111}.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.62}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,8,10,.97),rgba(6,8,10,.72) 55%,rgba(6,8,10,.18))}.heroBody{position:relative;z-index:1;padding:22px;display:flex;flex-direction:column;min-height:238px;justify-content:flex-end}.tag{display:inline-flex;align-self:flex-start;padding:6px 9px;border-radius:8px;background:var(--accentDim);color:var(--accent2);font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}.hero h1{font-size:30px;margin:10px 0 3px}.hero p{margin:0;color:#d0d3d6;font-size:12px}.start,.add{min-height:50px;border:0;border-radius:13px;background:var(--accent);color:#17100b;font-weight:700;padding:14px 16px}.start{margin-top:18px}.add{width:100%;margin-top:14px}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:18px 0}.day{text-align:center}.day b{font-size:9px;color:var(--muted);display:block;margin-bottom:7px}.dot{height:34px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;font-size:10px;color:#6f7881}.dot.done{background:var(--accent);color:#16100b;border-color:var(--accent)}.dot.next{border-color:rgba(255,138,50,.5);color:var(--accent)}.sectionTitle{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#c5cbd0;margin:22px 0 10px;font-weight:700}.stats,.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat,.metric{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 12px}.stat small,.metric small{color:var(--muted);font-size:9px}.stat strong,.metric b{display:block;margin-top:7px;font-size:18px}.insight,.nextload{margin-top:10px;border:1px solid rgba(255,138,50,.25);background:var(--accentDim);border-radius:14px;padding:14px}.insight b,.nextload b{color:var(--accent2);font-size:12px}.insight p{margin:5px 0 0;color:#d0d3d6;font-size:12px;line-height:1.5}.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--panel);border:1px solid var(--line);padding:4px;border-radius:13px;margin-bottom:16px}.tab{border:0;background:transparent;color:var(--muted);min-height:44px;padding:9px;border-radius:9px}.tab.active{background:var(--accent);color:#18100b;font-weight:700}.group{margin:18px 0}.groupHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.groupHead h3{font-size:12px;margin:0;color:#d8dce0;text-transform:uppercase;letter-spacing:.07em}.priority{font-size:9px;padding:4px 7px;border-radius:6px;background:var(--accentDim);color:var(--accent2)}.exercise{width:100%;text-align:left;color:inherit;display:grid;grid-template-columns:76px 1fr 32px;gap:11px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:9px;margin-bottom:9px;min-height:78px}.exercise:active,.liftTop:active{background:var(--panel2)}.exercise img{width:76px;height:64px;object-fit:cover;border-radius:10px;background:#1a1f24}.exercise h4{margin:0 0 4px;font-size:13px}.exercise p{margin:0;color:var(--muted);font-size:10px}.exercise .last{color:var(--accent2);margin-top:4px}.chev{color:var(--accent);font-size:24px;text-align:center}.workoutHead{display:flex;align-items:center;justify-content:space-between}.timer{font-size:24px;font-weight:700}.finish,.back,.topAction{min-width:44px;min-height:44px;border:0;border-radius:12px;background:transparent}.finish,.topAction{color:var(--accent);font-weight:600}.back{color:#fff;font-size:28px}.lift{background:var(--panel);border:1px solid var(--line);border-radius:15px;margin:10px 0;overflow:hidden}.liftTop{padding:13px;display:flex;gap:10px;align-items:center}.num{width:30px;height:30px;border-radius:9px;background:var(--accent);color:#17100b;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}.liftTop h4{margin:0;font-size:13px}.liftTop p{margin:3px 0 0;color:var(--accent2);font-size:10px}.sets{padding:0 12px 12px}.setrow{display:grid;grid-template-columns:24px 1fr 1fr 48px;gap:8px;align-items:center;margin-top:8px;font-size:10px;color:var(--muted)}.setrow input{width:100%;min-height:44px;background:#0b0e11;border:1px solid var(--line);border-radius:10px;color:white;padding:9px 7px;text-align:center;font-size:16px}.check{width:44px;height:44px;border-radius:50%;border:1px solid #3a434c;background:transparent;color:#65707a;font-size:18px}.check.done{background:var(--accent);border-color:var(--accent);color:#17100b}.historyCard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px}.historyCard h2{margin:8px 0 0;font-size:22px}.chart{height:150px;margin:18px 0 10px;position:relative;border-bottom:1px solid #283039;background:linear-gradient(to top,rgba(255,138,50,.06),transparent)}.chart svg{width:100%;height:100%}.recentRow{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:11px}.bottom{position:fixed;bottom:0;width:min(100%,430px);height:78px;background:rgba(12,15,18,.96);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:20;padding-bottom:env(safe-area-inset-bottom)}.nav{border:0;background:none;color:#78818a;font-size:11px;min-height:56px}.nav.active{color:var(--accent)}.screen{display:none}.screen.active{display:block}.muted{color:var(--muted)}.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);background:#20262b;border:1px solid #343d45;border-radius:12px;padding:11px 14px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:30;white-space:nowrap}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:360px){.exercise{grid-template-columns:64px 1fr 28px}.exercise img{width:64px;height:60px}.setrow{grid-template-columns:20px 1fr 1fr 44px}}</style></head><body><main class="app"><section id="home" class="screen active"><div class="top"><div><div class="brand"><span>Apex</span> Gym</div><small class="muted">Today · your next session</small></div><div class="avatar">NR</div></div><div class="content"><div class="hero"><img id="heroImg" alt="Today's training"><div class="heroBody"><span class="tag" id="todayTag"></span><h1 id="todayTitle"></h1><p id="todayMuscles"></p><button class="start" onclick="openWorkout()">Start Workout →</button></div></div><div class="week" id="week"></div><div class="sectionTitle">Progress overview</div><div class="stats"><div class="stat"><small>Streak</small><strong>12</strong></div><div class="stat"><small>Sessions</small><strong id="sessionsCount">0</strong></div><div class="stat"><small>7-day volume</small><strong id="volume">—</strong></div></div><div class="insight"><b>↗ Smarter progression</b><p id="homeInsight"></p></div></div></section><section id="program" class="screen"><div class="top"><button class="back" aria-label="Back home" onclick="show('home')">‹</button><b>Program</b><button class="topAction" onclick="toast('Program options coming next')" aria-label="Program options">•••</button></div><div class="content"><div class="tabs"><button class="tab active" onclick="switchDay(0,this)">Upper A</button><button class="tab" onclick="switchDay(1,this)">Lower</button><button class="tab" onclick="switchDay(2,this)">Upper B</button></div><div id="programList"></div></div></section><section id="workout" class="screen"><div class="top workoutHead"><button class="back" aria-label="Back home" onclick="show('home')">‹</button><div><small class="muted">Workout Time</small><div class="timer" id="timer">00:00</div></div><button class="finish" onclick="finishWorkout()">Finish</button></div><div class="content" id="workoutList"></div></section><section id="history" class="screen"><div class="top"><button class="back" aria-label="Back to program" onclick="show('program')">‹</button><b id="historyName">Exercise</b><button class="topAction" onclick="toast('History editing coming next')">Edit</button></div><div class="content"><div class="historyCard"><span class="tag" id="historyType"></span><h2 id="historyTitle"></h2><div class="chart"><svg viewBox="0 0 320 150" preserveAspectRatio="none"><polyline id="chartLine" fill="none" stroke="#ff8a32" stroke-width="3" points=""/><polyline id="chartFill" fill="rgba(255,138,50,.08)" stroke="none" points=""/></svg></div><div class="metrics"><div class="metric"><small>Est. 1RM</small><b id="oneRM">—</b></div><div class="metric"><small>Next load</small><b id="nextLoad">—</b></div><div class="metric"><small>Top set</small><b id="topSet">—</b></div></div><div class="sectionTitle">Recent sessions</div><div id="recent"></div><div class="nextload"><b>↗ Progressive overload</b><div id="progressionText" style="font-size:11px;margin-top:5px;color:#d7d9db"></div></div></div></div></section><nav class="bottom"><button class="nav active" onclick="navTo('home',this)">⌂<br>Home</button><button class="nav" onclick="navTo('program',this)">▣<br>Program</button><button class="nav" onclick="openWorkout();setNav(this)">◷<br>Log</button><button class="nav" onclick="openHistory('Bench Press');setNav(this)">▥<br>Progress</button></nav></main><div class="toast" id="toastEl"></div><script>const BASE='https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/';const FALL='https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=400&q=75';const img=id=>BASE+id+'/0.jpg';const DAYS=[{name:'Upper Day A',muscles:'Chest · Back · Shoulders · Arms',hero:img('Bench_Press'),groups:[['Chest & Front Delts','PRIMARY',[['Bench Press','Compound',4,'6–8','Bench_Press'],['Incline DB Press','Compound',3,'8–12','Incline_Dumbbell_Press']]],['Back & Rear Delts','PRIMARY',[['Bent Over Row','Compound',4,'6–8','Bent_Over_Two-Dumbbell_Row'],['Lat Pulldown','Compound',4,'8–12','Wide-Grip_Lat_Pulldown'],['Face Pull','Isolation',3,'12–15','Face_Pull']]],['Arms','SECONDARY',[['Barbell Curl','Isolation',3,'8–12','Barbell_Curl'],['Triceps Pushdown','Isolation',3,'10–15','Triceps_Pushdown']]]]},{name:'Lower Day',muscles:'Quads · Hamstrings · Glutes · Calves',hero:img('Barbell_Squat'),groups:[['Quads & Glutes','PRIMARY',[['Back Squat','Compound',4,'6–8','Barbell_Squat'],['Leg Press','Compound',3,'8–12','Leg_Press']]],['Hamstrings & Glutes','PRIMARY',[['Romanian Deadlift','Compound',4,'6–10','Romanian_Deadlift'],['Leg Curl','Isolation',3,'10–15','Lying_Leg_Curls']]],['Calves','SECONDARY',[['Standing Calf Raise','Isolation',4,'10–15','Standing_Calf_Raises']]]]},{name:'Upper Day B',muscles:'Back · Chest · Delts · Arms',hero:img('Pullups'),groups:[['Back & Rear Delts','PRIMARY',[['Pull Up','Compound',4,'6–10','Pullups'],['Chest Supported Row','Compound',3,'8–12','Dumbbell_Incline_Row']]],['Chest & Shoulders','PRIMARY',[['Overhead Press','Compound',4,'6–8','Standing_Military_Press'],['Machine Chest Press','Compound',3,'8–12','Machine_Bench_Press']]],['Arms','SECONDARY',[['Hammer Curl','Isolation',3,'10–12','Hammer_Curls'],['Cable Extension','Isolation',3,'10–15','Cable_One_Arm_Tricep_Extension']]]]}];let activeDay=Number(localStorage.apexDay||0),started=0,timerInt=null;const store=JSON.parse(localStorage.apexStore||'{}');function save(){localStorage.apexStore=JSON.stringify(store)}function hist(n){return store[n]||(store[n]=[])}function last(n){let h=hist(n);return h[h.length-1]||null}function targetLoad(n){let l=last(n);if(!l)return n.includes('Press')||n.includes('Row')?75:40;let good=l.sets.every(s=>s.reps>=l.minRep);return good?Math.round((l.weight+(l.weight<60?2.5:5))*2)/2:l.weight}function day(){return DAYS[activeDay]}function safeImg(el){el.onerror=null;el.src=FALL}function toast(t){toastEl.textContent=t;toastEl.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>toastEl.classList.remove('show'),1800)}function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');if(id==='program')renderProgram();if(id==='workout')renderWorkout();scrollTo(0,0)}function setNav(b){document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));b.classList.add('active')}function navTo(id,b){setNav(b);show(id)}function switchDay(i,b){activeDay=i;localStorage.apexDay=i;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderProgram();updateHome()}function renderProgram(){let d=day();document.querySelectorAll('.tab').forEach((x,i)=>x.classList.toggle('active',i===activeDay));let html=`<div style="margin-bottom:15px"><h2 style="margin:0">${d.name}</h2><small class="muted">Strength & hypertrophy · ${d.muscles}</small></div>`;d.groups.forEach(g=>{html+=`<div class="group"><div class="groupHead"><h3>${g[0]}</h3><span class="priority">${g[1]}</span></div>`;g[2].forEach(e=>{let l=last(e[0]);html+=`<button class="exercise" onclick="openHistory('${e[0]}')"><img src="${img(e[4])}" onerror="safeImg(this)" alt="${e[0]}"><div><h4>${e[0]}</h4><p>${e[2]} sets · ${e[3]} reps · ${e[1]}</p><p class="last">${l?`Last: ${l.weight} lb × ${Math.max(...l.sets.map(s=>s.reps))}`:'No history yet'}</p></div><div class="chev">›</div></button>`});html+='</div>'});programList.innerHTML=html}function openWorkout(){show('workout');started=Date.now();clearInterval(timerInt);timerInt=setInterval(()=>{let s=Math.floor((Date.now()-started)/1000);timer.textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`},1000)}function renderWorkout(){let html='',idx=0;day().groups.forEach(g=>{html+=`<div class="groupHead"><h3>${g[0]}</h3><span class="priority">${g[1]}</span></div>`;g[2].forEach(e=>{idx++;let prev=last(e[0]),load=targetLoad(e[0]),min=parseInt(e[3]);html+=`<div class="lift" data-name="${e[0]}" data-min="${min}"><div class="liftTop"><span class="num">${idx}</span><div><h4>${e[0]}</h4><p>${prev?`Last: ${prev.weight} lb × ${Math.max(...prev.sets.map(s=>s.reps))}`:'First logged session'} · Target ${load} lb</p></div></div><div class="sets">`;for(let s=0;s<e[2];s++)html+=`<div class="setrow"><span>${s+1}</span><input aria-label="Weight set ${s+1}" class="weight" inputmode="decimal" value="${load}"><input aria-label="Reps set ${s+1}" class="reps" inputmode="numeric" placeholder="reps"><button aria-label="Complete set ${s+1}" class="check" onclick="this.classList.toggle('done')">✓</button></div>`;html+='</div></div>'})});html+='<button class="add" onclick="toast(\'Custom exercise entry coming next\')">+ Add Exercise</button>';workoutList.innerHTML=html}function finishWorkout(){let completed=0;document.querySelectorAll('.lift').forEach(el=>{let name=el.dataset.name,minRep=Number(el.dataset.min),rows=[...el.querySelectorAll('.setrow')],done=rows.filter(r=>r.querySelector('.check').classList.contains('done'));if(!done.length)return;completed++;let weight=Number(done[0].querySelector('.weight').value)||0,sets=done.map(r=>({reps:Number(r.querySelector('.reps').value)||0,minRep}));hist(name).push({date:new Date().toLocaleDateString('en-CA'),weight,sets,minRep})});if(!completed){toast('Complete at least one set first');return}save();localStorage.apexSessions=Number(localStorage.apexSessions||0)+1;activeDay=(activeDay+1)%3;localStorage.apexDay=activeDay;clearInterval(timerInt);updateHome();show('home');toast('Workout saved · next session ready')}function openHistory(name){show('history');let all=DAYS.flatMap(d=>d.groups.flatMap(g=>g[2])),e=all.find(x=>x[0]===name)||all[0];historyName.textContent=name;historyTitle.textContent=name;historyType.textContent=e[1];let h=hist(name),display=h.length?h:[{date:'Session 1',weight:60,sets:[{reps:8}],minRep:6},{date:'Session 2',weight:65,sets:[{reps:8}],minRep:6},{date:'Session 3',weight:70,sets:[{reps:8}],minRep:6},{date:'Session 4',weight:75,sets:[{reps:8}],minRep:6}];let vals=display.slice(-8).map(x=>x.weight),mi=Math.min(...vals)-5,ma=Math.max(...vals)+5,pts=vals.map((v,i)=>`${i*(300/Math.max(vals.length-1,1))+10},${135-(v-mi)/(ma-mi||1)*115}`);chartLine.setAttribute('points',pts.join(' '));chartFill.setAttribute('points',`10,145 ${pts.join(' ')} 310,145`);let l=display.at(-1),reps=Math.max(...l.sets.map(s=>s.reps)),orm=Math.round(l.weight*(1+reps/30));oneRM.textContent=orm+' lb';nextLoad.textContent=targetLoad(name)+' lb';topSet.textContent=`${l.weight} lb × ${reps}`;recent.innerHTML=display.slice(-5).reverse().map(x=>`<div class="recentRow"><span>${x.date}</span><b>${x.weight} lb × ${Math.max(...x.sets.map(s=>s.reps))}</b></div>`).join('');progressionText.textContent=targetLoad(name)>l.weight?`You hit the target. Add ${targetLoad(name)-l.weight} lb next time.`:`Stay at ${l.weight} lb until all working sets reach the rep target.`}function updateHome(){let d=day();todayTag.textContent=d.name;todayTitle.textContent=d.name;todayMuscles.textContent=d.muscles;heroImg.src=d.hero;heroImg.onerror=()=>safeImg(heroImg);sessionsCount.textContent=localStorage.apexSessions||0;let vol=0;Object.values(store).flat().slice(-20).forEach(x=>vol+=x.weight*x.sets.reduce((a,s)=>a+s.reps,0));volume.textContent=vol?Math.round(vol).toLocaleString()+' lb':'—';let names=d.groups.flatMap(g=>g[2].map(e=>e[0])),ready=names.filter(n=>last(n)&&targetLoad(n)>last(n).weight).length;homeInsight.textContent=ready?`${ready} lift${ready>1?'s are':' is'} ready for more weight based on your previous completed sets.`:'Finish all working sets inside the target range to unlock a load increase.';let labels=['U','L','U','R','L','R','R'];week.innerHTML=labels.map((x,i)=>`<div class="day"><b>${['M','T','W','T','F','S','S'][i]}</b><div class="dot ${i<3?'done':i===3?'next':''}">${x}</div></div>`).join('')}updateHome();renderProgram();</script></body></html>
